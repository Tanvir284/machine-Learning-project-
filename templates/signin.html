<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPredict — Sign In</title>
    <meta name="description" content="Sign in to your EduPredict account to predict student exam performance.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #0a0a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .bg-gradient {
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 80%, rgba(99, 102, 241, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse 60% 80% at 85% 15%, rgba(168, 85, 247, 0.10) 0%, transparent 60%);
            z-index: 0;
        }

        .orb {
            position: fixed; border-radius: 50%; filter: blur(100px); opacity: 0.3;
            animation: float 25s ease-in-out infinite;
        }
        .orb-1 {
            width: 500px; height: 500px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            top: -150px; right: -150px;
        }
        .orb-2 {
            width: 400px; height: 400px;
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            bottom: -120px; left: -120px;
            animation-delay: -8s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.04); }
            66% { transform: translate(-20px, 20px) scale(0.96); }
        }

        .grid-overlay {
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 60px 60px; z-index: 1;
        }

        /* Card */
        .card {
            position: relative; z-index: 10;
            width: 100%; max-width: 460px;
            background: rgba(15, 15, 35, 0.6);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 48px;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.03) inset, 0 24px 80px rgba(0,0,0,0.4);
            animation: cardIn 0.6s ease-out;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Header */
        .card-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            display: inline-flex; align-items: center; gap: 10px;
            margin-bottom: 28px; text-decoration: none;
        }

        .logo-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
        }

        .logo-text {
            font-size: 1.3rem; font-weight: 700; color: #f1f5f9;
        }

        .card-header h1 {
            font-size: 1.6rem; font-weight: 700; color: #f1f5f9; margin-bottom: 8px;
        }

        .card-header p {
            color: #64748b; font-size: 0.88rem; line-height: 1.5;
        }

        .card-header p a {
            color: #818cf8; text-decoration: none; font-weight: 500;
            transition: color 0.2s;
        }
        .card-header p a:hover { color: #a5b4fc; }

        /* Flash messages */
        .flash-msg {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 20px;
            display: flex; align-items: center; gap: 10px;
            animation: flashIn 0.3s ease-out;
        }

        @keyframes flashIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .flash-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .flash-info {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.78rem; font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 7px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .icon {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            color: #475569; pointer-events: none; transition: color 0.2s;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            font-size: 0.92rem;
            transition: all 0.25s ease;
            outline: none;
        }

        .form-group input::placeholder { color: #475569; }

        .form-group input:focus {
            border-color: rgba(99, 102, 241, 0.5);
            background: rgba(99, 102, 241, 0.06);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .form-group input:focus ~ .icon {
            color: #818cf8;
        }

        .password-toggle {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: #475569; cursor: pointer;
            padding: 4px; transition: color 0.2s;
        }
        .password-toggle:hover { color: #94a3b8; }

        /* Remember + Forgot */
        .form-options {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 24px;
        }

        .remember-me {
            display: flex; align-items: center; gap: 8px;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: 16px; height: 16px;
            accent-color: #6366f1;
            cursor: pointer;
        }

        .remember-me span {
            font-size: 0.82rem; color: #94a3b8; font-weight: 500;
        }

        .forgot-link {
            font-size: 0.82rem; color: #818cf8; font-weight: 500;
            text-decoration: none; transition: color 0.2s;
        }
        .forgot-link:hover { color: #a5b4fc; }

        /* Submit */
        .submit-btn {
            width: 100%;
            padding: 15px 24px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem; font-weight: 600;
            border: none; border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.45);
            background: linear-gradient(135deg, #818cf8, #a78bfa);
        }
        .submit-btn:active { transform: translateY(0); }

        /* Divider */
        .divider {
            display: flex; align-items: center; gap: 16px;
            margin: 28px 0;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px;
            background: rgba(255,255,255,0.06);
        }
        .divider span {
            font-size: 0.75rem; color: #475569; font-weight: 500;
            text-transform: uppercase; letter-spacing: 1px;
        }

        /* Social */
        .social-btn {
            width: 100%;
            padding: 13px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #cbd5e1;
            font-family: 'Inter', sans-serif;
            font-size: 0.88rem; font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .social-btn:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .card-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.82rem;
            color: #64748b;
        }
        .card-footer a {
            color: #818cf8; text-decoration: none; font-weight: 600;
        }
        .card-footer a:hover { color: #a5b4fc; }

        @media (max-width: 500px) {
            .card { padding: 32px 24px; }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="grid-overlay"></div>

    <div class="card">
        <div class="card-header">
            <a href="/" class="logo">
                <div class="logo-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                    </svg>
                </div>
                <span class="logo-text">EduPredict</span>
            </a>
            <h1>Welcome back</h1>
            <p>Don't have an account? <a href="{{ url_for('signup') }}">Sign up free</a></p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-msg flash-{{ category }}">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            {% if category == 'error' %}
                                <circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/>
                            {% else %}
                                <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
                            {% endif %}
                        </svg>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('signin') }}" id="signin-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
                    <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="20" height="16" x="2" y="4" rx="2"/>
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                    </svg>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                    <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <button type="button" class="password-toggle" onclick="togglePw()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember" checked>
                    <span>Remember me</span>
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="submit-btn" id="signin-submit">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                    <polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/>
                </svg>
                Sign In
            </button>
        </form>

        <div class="card-footer">
            <p>New to EduPredict? <a href="{{ url_for('signup') }}">Create a free account →</a></p>
        </div>
    </div>

    <script>
        function togglePw() {
            const el = document.getElementById('password');
            el.type = el.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
